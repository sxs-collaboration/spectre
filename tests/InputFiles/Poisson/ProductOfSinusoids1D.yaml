Executable: SolvePoisson1D
Testing:
  Check: parse;execute_check_output
  Timeout: 10
ExpectedOutput:
  - PoissonProductOfSinusoids1DReductions.h5
  - PoissonProductOfSinusoids1DVolume0.h5
OutputFileChecks:
  - Label: Discretization error
    Subfile: ErrorNorms.dat
    FileGlob: PoissonProductOfSinusoids1DReductions.h5
    ExpectedData:
      - [0, 8, 4.71238898038469e+00, 7.07106781186548e-01]
      - [1, 8, 4.71238898038469e+00, 4.14037391064113e-03]
      - [2, 16, 4.71238898038469e+00, 1.96421037243931e-04]
      - [3, 20, 4.71238898038469e+00, 1.47125554015345e-05]
    AbsoluteTolerance: 1e-6
  - Label: Linear solver convergence
    Subfile: GmresResiduals.dat
    FileGlob: PoissonProductOfSinusoids1DReductions.h5
    SkipColumns: [1] # Skip walltime
    ExpectedData:
      # Each AMR iteration is solved directly by the multigrid bottom solver
      # AMR iteration 0
      - [0, 1.218121e+01]
      - [1, 0.0]
      # AMR iteration 1
      - [0, 2.094477e-01]
      - [1, 0.0]
      # AMR iteration 2
      - [0, 3.158830e-02]
      - [1, 0.0]
    AbsoluteTolerance: 1e-6

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

Background: &solution
  ProductOfSinusoids:
    WaveNumbers: [1]

InitialGuess:
  Zero:

RandomizeInitialGuess: None

DomainCreator:
  Interval:
    LowerBound: [-1.570796326794896]
    UpperBound: [3.141592653589793]
    Distribution: [Linear]
    InitialRefinement: [1]
    InitialGridPoints: [4]
    TimeDependence: None
    BoundaryConditions:
      - Lower:
          AnalyticSolution:
            Solution: *solution
            Field: Dirichlet
        Upper:
          AnalyticSolution:
            Solution: *solution
            Field: Neumann

Amr:
  Verbosity: Debug
  Criteria:
    - DriveToTargetRefinementLevels:
        # First AMR iteration will split the 2 elements in 4
        Target: [2]
        OscillationAtTarget: [DoNothing]
    - DriveToTargetNumberOfGridPoints:
        # Second AMR iteration will increase num points from 4 to 5
        Target: [5]
        OscillationAtTarget: [DoNothing]
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: False
    AllowCoarsening: True
  MaxCoarseLevels: 0
  Iterations: 3

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.
    Massive: True
    Quadrature: GaussLobatto
    Formulation: StrongInertial

Observers:
  VolumeFileName: "PoissonProductOfSinusoids1DVolume"
  ReductionFileName: "PoissonProductOfSinusoids1DReductions"

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 10
      RelativeResidual: 1.e-10
      AbsoluteResidual: 1.e-6
    Verbosity: Verbose

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: 0
    PreSmoothing: True
    UseBottomSolver: True
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: True

  SchwarzSmoother:
    Iterations: 3
    MaxOverlap: 2
    Verbosity: Silent
    SubdomainSolver:
      ExplicitInverse:
        WriteMatrixToFile: None
    ObservePerCoreReductions: False
    OutputVolumeData: False

RadiallyCompressedCoordinates: None

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveNorms:
          SubfileName: ErrorNorms
          TensorsToObserve:
            - Name: Error(Field)
              NormType: L2Norm
              Components: Sum
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve: [Field]
          InterpolateToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Verbose
  EnableDirectSolve: True
