Executable: EvolveForceFree
Testing:
  Check: parse;execute
  Priority: High

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false

InitialData: &InitialData
  FastWave:

Evolution:
  InitialTime: 0.0
  InitialTimeStep: &initial_time_step 0.005
  InitialSlabSize: *initial_time_step
  MinimumTimeStep: 1e-7
  LocalTimeStepping: Off
  TimeStepper:
    ClassicalRungeKutta4
  LtsStepChoosers:
  VariableOrderAlgorithm:
    GoalOrder: 4

EvolutionSystem:
  ForceFree:
    ConstraintDamping:
      KappaPsi: 1.0
      KappaPhi: 1.0
    ForceFreeCurrent:
      ParallelConductivity: 0.0

DomainCreator:
  Brick:
    LowerBound: [-1.0, -1.0, -1.0]
    UpperBound: [1.0, 1.0, 1.0]
    Distribution: [Linear, Linear, Linear]
    InitialRefinement: [2, 0, 0]
    InitialGridPoints: [6, 6, 6]
    TimeDependence: None
    BoundaryConditions:
      - DirichletAnalytic:
          AnalyticPrescription: *InitialData
      - Periodic
      - Periodic

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      - Hypercube:
          HalfPower: 50
          Enable: false
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None

Observers:
  VolumeFileName: "ForceFreeFastWaveVolume"
  ReductionFileName: "ForceFreeFastWaveReductions"

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        Specified:
          Values: [2]
    Events:
      - Completion

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:

PhaseChangeAndTriggers:
