Executable: EvolveScalarWave1D
Testing:
  Check: parse;execute
  Priority: High
ExpectedOutput:
  - ScalarWavePlaneWave1DReductions.h5

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InitialData: &InitialData
  PlaneWave:
    WaveVector: [1.0]
    Center: [0.0]
    Profile:
      Sinusoid:
        Amplitude: 1.0
        Wavenumber: 1.0
        Phase: 0.0

Amr:
  Criteria:
    - DriveToTargetRefinementLevels:
        Target: [4]
        OscillationAtTarget: [Split]
    - TruncationError:
        VariablesToMonitor: [Psi]
        AbsoluteTarget: 1.e-6
        RelativeTarget: 1.e-6
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel: Auto
      NumGridPoints: Auto
      ErrorBeyondLimits: False
    AllowCoarsening: True
  Verbosity: Verbose

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(CheckDomain)
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 3
          Offset: 0
    PhaseChanges:
      - VisitAndReturn(WriteCheckpoint)

Evolution:
  InitialTime: 0.0
  InitialTimeStep: &initial_time_step 0.001
  InitialSlabSize: *initial_time_step
  MinimumTimeStep: 1e-7
  LocalTimeStepping: Off
  TimeStepper:
    AdamsBashforth:
      Order: 3
  LtsStepChoosers:
  VariableOrderAlgorithm:
    GoalOrder: 3

DomainCreator:
  RotatedIntervals:
    LowerBound: [0.0]
    Midpoint: [3.14159]
    UpperBound: [6.283185307179586]
    InitialRefinement: [1]
    InitialGridPoints: [[7, 3]]
    TimeDependence: None
    BoundaryConditions:
      LowerBoundary:
        DirichletAnalytic:
          AnalyticPrescription: *InitialData
      UpperBoundary:
        DirichletAnalytic:
          AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      - Hypercube:
          HalfPower: 128
          Enable: false
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - RefineMesh
      - ObserveAmrStats:
          PrintToTerminal: True
          ObservePerCore: False
  - Trigger:
      Slabs:
        Specified:
          Values: [5]
    Events:
      - Completion

EventsAndTriggersAtSteps:

EventsAndTriggersAtCheckpoints:
  - Trigger: Always
    Events:
      - ObserveFields:
          SubfileName: CheckpointVolumeData
          VariablesToObserve: ["Psi", "Pi", "Phi"]
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All

EventsAndDenseTriggers:

Observers:
  VolumeFileName: "ScalarWavePlaneWave1DVolume"
  ReductionFileName: "ScalarWavePlaneWave1DReductions"
