---

# CheckpointAndExitAfterWallclock must still be in
# PhaseChangeAndTriggers so that the restart logic will run.
PhaseChangeAndTriggers:
  - Trigger:
      SlabCompares:
        Comparison: GreaterThan
        Value: 0
    PhaseChanges:
      - CheckpointAndExitAfterWallclock:
          WallclockHours: None

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      SlabCompares:
        Comparison: GreaterThanOrEqualTo
        Value: 3
    Events:
      - ObserveNorms:
          SubfileName: ErrorsFinal
          TensorsToObserve:
            - Name: Error(Psi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Phi)
              NormType: L2Norm
              Components: Sum
            - Name: Error(Pi)
              NormType: L2Norm
              Components: Sum
      - ObserveFields:
          SubfileName: FieldsFinal
          VariablesToObserve: [Psi]
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
      - Completion
