Executable: EvolveScalarWave3D
Testing:
  Check: parse;execute

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

InitialData: &InitialData
  RegularSphericalWave:
    Profile:
      Gaussian:
        Amplitude: 1.0
        Width: 1.0
        Center: 2.4

Amr:
  Criteria:
  EnableInBlocks: All
  Policies:
    AllowCoarsening: true
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel: Auto
      NumGridPoints: Auto
      ErrorBeyondLimits: False
  Verbosity: Verbose

PhaseChangeAndTriggers:

Evolution:
  InitialTime: 0.0
  InitialTimeStep: &initial_time_step 0.001
  InitialSlabSize: *initial_time_step
  MinimumTimeStep: 1e-7
  LocalTimeStepping: Off
  TimeStepper:
    AdamsBashforth:
      Order: 3
  LtsStepChoosers:
  VariableOrderAlgorithm:
    GoalOrder: 3

DomainCreator:
  NonconformingSphericalShells:
    InnerRadius: 1.9
    InterfaceRadius: 2.4
    OuterRadius: 2.9
    InitialRadialRefinement: 0
    InitialAngularRefinementOfWedges: 1
    InitialNumberOfRadialGridPoints: 5
    InitialSphericalHarmonicL: 4
    InitialNumberOfAngularGridPointsOfWedges: 5
    InnerBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    UpwindPenalty:
  DiscontinuousGalerkin:
    Filtering:
      # Scalar Wave doesn't yet have Ylm filtering implemented.
      # That will be needed for stable evolutions.
      - None:
          BlocksToFilter: All
    Formulation: StrongInertial
    Quadrature: GaussLobatto

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        Specified:
          Values: [50]
    Events:
      - Completion

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:

Observers:
  VolumeFileName: "Volume"
  ReductionFileName: "Reductions"
