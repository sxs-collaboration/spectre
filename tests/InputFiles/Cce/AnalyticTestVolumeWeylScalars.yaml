Executable: AnalyticTestCharacteristicExtract
Testing:
  Check: parse;execute_check_output
  Timeout: 20
  Priority: High
ExpectedOutput:
  - CharacteristicExtractVolume.h5
OutputFileChecks:
  - Label: "check_psi0"
    Subfile: "/CceVolumeData/VolumeData.vol/ObservationId.*/Psi0"
    FileGlob: "CharacteristicExtractVolume.h5"
    # By not specifying an expected value, we test against 0
    AbsoluteTolerance: 1e-8
  - Label: "check_psi1"
    Subfile: "/CceVolumeData/VolumeData.vol/ObservationId.*/Psi1"
    FileGlob: "CharacteristicExtractVolume.h5"
    # By not specifying an expected value, we test against 0
    AbsoluteTolerance: 1e-8
ExtraFileCheckExecs:
  - Label: "check_psi2"
    Executable: "AnalyticTestVolumeWeylPsi2.py"
    Arguments: ["--atol", "1.e-10", "--rtol", "1.e-10"]

---

Evolution:
  InitialTimeStep: 0.01
  InitialSlabSize: 0.8

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons:
    CharacteristicEvolution:
      Proc: Auto
      Exclusive: false
    AnalyticWorldtubeBoundary:
      Proc: Auto
      Exclusive: false

Observers:
  VolumeFileName: "CharacteristicExtractVolume"
  ReductionFileName: "CharacteristicExtractReduction"

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Offset: 0
          Interval: 1
    Events:
      - ObserveTimeStep:
          SubfileName: CceTimeStep
          PrintTimeToTerminal: false
      - ObserveFields:
          SubgroupName: "CceVolumeData"
          VariablesToObserve:
            - OneMinusY
            - InertialRetardedTime
            - Psi0
            - Psi1
            - Psi2

EventsAndTriggersAtSteps:

Cce:
  Evolution:
    TimeStepper:
      AdamsBashforth:
        Order: 3
    VariableOrderAlgorithm:
      GoalOrder: 3
    MinimumTimeStep: 1e-7
    StepChoosers:
      - Constant: 0.1
      - LimitIncrease:
          Factor: 2

  LMax: 8
  NumberOfRadialPoints: 8
  ObservationLMax: 8

  StartTime: 0.0
  EndTime: 0.8
  ExtractionRadius: 30.0

  AnalyticSolution:
    BouncingBlackHole:
      Period: 40.0
      ExtractionRadius: 30.0
      Mass: 1.0
      Amplitude: 0.0

  Filtering:
    RadialFilterHalfPower: 24
    RadialFilterAlpha: 35.0
    FilterLMax: 6

  ScriInterpOrder: 3
  ScriOutputDensity: 1
