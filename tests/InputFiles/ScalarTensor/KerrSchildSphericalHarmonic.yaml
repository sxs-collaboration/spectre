Executable: EvolveScalarTensorSingleBlackHole
Testing:
  Check: parse;execute_check_output
  Timeout: 40
ExpectedOutput:
  - KerrSchildSphericalHarmonicVolume0.h5
  - KerrSchildSphericalHarmonicReductions.h5
  - KerrSchildSphericalHarmonicSurfaces.h5
OutputFileChecks:
  - Label: "check_horizon_find"
    Subfile: "/ApparentHorizon.dat"
    FileGlob: "KerrSchildSphericalHarmonicReductions.h5"
    AbsoluteTolerance: 1e2

---

Parallelization:
  ElementDistribution: NumGridPointsAndGridSpacing

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.001
  MinimumTimeStep: 1e-7
  TimeStepper:
    AdamsBashforth:
      Order: 3
  InitialSlabSize: 0.001
  VariableOrderAlgorithm:
    GoalOrder: 3
  LtsStepChoosers:
    - LimitIncrease:
        Factor: 2
    - PreventRapidIncrease
    - Cfl:
        SafetyFactor: 0.2

PhaseChangeAndTriggers:

InitialData: &InitialData
  GeneralizedHarmonic(KerrSphericalHarmonic):
    Mass: 1.0
    Spin: [0.0, 0.0, 0.0]
    Amplitude: 0.001
    Radius: 8.0
    Width: 2.0
    Mode: [0, 0]

DomainCreator:
  Sphere:
    InnerRadius: &InnerRadius 1.9
    OuterRadius: 25.0
    Interior:
      ExciseWithBoundaryCondition:
        DirichletAnalytic:
          AnalyticPrescription: *InitialData
          Amplitude: 0.0
    InitialRefinement: [0, 0, 1]
    InitialGridPoints: [6, 6, 6]
    UseEquiangularMap: true
    EquatorialCompression: None
    RadialPartitioning: []
    RadialDistribution: [Logarithmic]
    WhichWedges: All
    TimeDependentMaps: None
    OuterBoundaryCondition:
      DirichletAnalytic:
        AnalyticPrescription: *InitialData
        Amplitude: 0.0

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      AnalyticChristoffel:
        AnalyticPrescription: *InitialData
    # The parameter choices here come from our experience with the Spectral
    # Einstein Code (SpEC). They should be suitable for evolutions of a
    # perturbation of a Kerr-Schild black hole.
    DampingFunctionGamma0:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 3.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: -1.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
  ScalarTensor:
    ScalarMass: 0.0
    # Ramp up effectively disabled
    RampUpStart: -2.0
    RampUpDuration: 1.0
    CouplingParameters:
      Linear: 0.0
      Quadratic: 0.0
      Quartic: 0.0
    DampingFunctionGamma1:
      GaussianPlusConstant:
        Constant: 0.0
        Amplitude: 0.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]
    DampingFunctionGamma2:
      GaussianPlusConstant:
        Constant: 0.001
        Amplitude: 1.0
        Width: 11.313708499
        Center: [0.0, 0.0, 0.0]

SpatialDiscretization:
  BoundaryCorrection:
    ProductAveragedUpwindPenaltyGHAndUpwindPenaltyScalar:
      AveragedUpwindPenaltyGH:
      UpwindPenaltyScalar:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      - Hypercube:
          HalfPower: 64
          Enable: true
          BlocksToFilter: All
          VolumeFilterOnSubstep: true
          BoundaryCorrectionFilterOnSubstep: false
          VolumeFilterEveryNSteps: None
          BoundaryCorrectionFilterEveryNSteps: None

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      TimeCompares:
        Comparison: GreaterThan
        Value: 0.1
    Events:
      - Completion
  - Trigger:
      Slabs:
        Specified:
          Values: [2]
    Events:
      - Completion
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    Events:
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
          - Name: Lapse
            NormType: L2Norm
            Components: Individual
          - Name: PointwiseL2Norm(GaugeConstraint)
            NormType: L2Norm
            Components: Sum
          - Name: PointwiseL2Norm(ThreeIndexConstraint)
            NormType: L2Norm
            Components: Sum
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 5
          Offset: 0
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - Csw(Pi)
            - Lapse
            - PointwiseL2Norm(GaugeConstraint)
            - PointwiseL2Norm(TwoIndexConstraint)
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]
          BlocksToObserve: All
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 2
    Events:
      - ApparentHorizon
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 4
          Offset: 0
    Events:
      - ExcisionBoundaryA
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 2
          Offset: 0
    Events:
      - SphericalSurface

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:
    - ObserveTimeStepVolume:
        SubfileName: FailureTimeStep
        FloatingPointType: Double
        CoordinatesFloatingPointType: Float

Observers:
  VolumeFileName: "KerrSchildSphericalHarmonicVolume"
  ReductionFileName: "KerrSchildSphericalHarmonicReductions"
  SurfaceFileName: "KerrSchildSphericalHarmonicSurfaces"

Interpolator:
  Verbosity: Silent

ApparentHorizons:
  LMax: &LMax 4
  ApparentHorizon: &Ah
    Criteria:
    InitialGuess:
      InitialL: *LMax
      InitialShape:
        Sphere:
          Radius: 2.2
          Center: [0., 0., 0.]
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-5
      DivergenceTol: 5
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Quiet
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: ["Shell0"]
  ControlSystemSingleAh: *Ah
  ControlSystemCharSpeedAh: *Ah

InterpolationTargets:
  ExcisionBoundaryA: &ExBdry
    LMax: *LMax
    Center: [0.0, 0.0, 0.0]
    Radius: *InnerRadius
    AngularOrdering: "Strahlkorper"
  BondiSachsInterpolation:
    LMax: 16
    Radius: [100, 150, 200]
    Center: [0, 0, 0]
    AngularOrdering: Cce
  SphericalSurface:
    LMax: 10
    Center: [0., 0., 0.]
    Radius: 12.0
    AngularOrdering: Strahlkorper
  ControlSystemCharSpeedExcision: *ExBdry

Cce:
  BondiSachsOutputFilePrefix: "BondiSachs"

ControlSystems:
  WriteDataToDisk: false
  MeasurementsPerUpdate: 4
  DelayUpdate: true
  Verbosity: Silent
  Shape: None
  Translation: None
  Size: None

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
