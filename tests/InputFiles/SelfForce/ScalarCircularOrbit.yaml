Executable: SolveScalarSelfForce
Testing:
  Check: parse;execute_check_output
  Timeout: 10
ExpectedOutput:
  - ScalarSelfForceReductions.h5
  - ScalarSelfForceVolume0.h5
OutputFileChecks:
  - Label: SelfForce
    Subfile: SelfForce.dat
    FileGlob: ScalarSelfForceReductions.h5
    ExpectedData:
      # Iteration | NumPoints | NumContributingElements
      # | Re(SelfForce_r) | Im(SelfForce_r)
      # | Re(SelfForce_theta) | Im(SelfForce_theta)
      - [0, 480, 4, 0., 0., 0., 0.]
      - [1, 480, 4, -9.183e-5, 9.451e-5, 0., 0.]
      - [2, 975, 4, -1.365e-4, 9.138e-5, 0., 0.]
    AbsoluteTolerance: 2.0e-7
    RelativeTolerance: 0.

---

Background: &background
  CircularOrbit:
    BlackHoleMass: &bh_mass 1.
    BlackHoleSpin: &bh_spin 0.5
    OrbitalRadius: &orbital_radius 10.
    MModeNumber: &m_mode_number 1
    HyperboloidalSlicingTransitions: [5., 5., 25., 25.]
    ImposeEquatorialSymmetry: False
    PenetratingHorizon: True

ScalarSelfForce:
  NullSlicingBlocks:
    - 'Block(0,0)'
    - 'Block(4,0)'
    - 'Block(0,1)'
    - 'Block(4,1)'
    - 'Block(0,2)'
    - 'Block(4,2)'

InitialGuess: *background

RandomizeInitialGuess: None

DomainCreator:
  AlignedLattice:
    # Order of dimensions is (r, cos(theta))
    BlockBounds:
      # Puncture position is at r = 10.
      - [1.866025403784, 5., 6., &worldtube_right 14,
         25., &outer_radius 1e4] # r_*
      - [-1., -0.5, 0.5, 1.]  # cos(theta)
    Distributions:
      # r_*
      - [Linear, Linear, Linear, Linear, &outer_shell_distribution Inverse]
      # cos(theta)
      - [Linear, Linear, Linear]
    SingularityPositions:
      # r_*
      - [-51., -51., -51., 0., 0.]
      # os(theta)
      - [-2., -2., -2.]
    InitialGridPoints: [4, 4]
    InitialLevels: [0, 0]
    RefinedGridPoints: []
    BlocksToExclude: []
    RefinedLevels:
      # bottom row
      - LowerCornerIndex: [0, 0] # bottom left
        UpperCornerIndex: [1, 1]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 0] # bottom transition left
        UpperCornerIndex: [2, 1]
        Refinement: [0, 0]
      - LowerCornerIndex: [2, 0] # bottom middle
        UpperCornerIndex: [3, 1]
        Refinement: [1, 1]
      - LowerCornerIndex: [3, 0] # bottom transition right
        UpperCornerIndex: [4, 1]
        Refinement: [0, 1]
      - LowerCornerIndex: [4, 0] # bottom right
        UpperCornerIndex: [5, 1]
        Refinement: [1, 0]
      # middle row
      - LowerCornerIndex: [0, 1] # middle left
        UpperCornerIndex: [1, 2]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 1] # middle transition left
        UpperCornerIndex: [2, 2]
        Refinement: [0, 0]
      - LowerCornerIndex: [2, 1] # source region
        UpperCornerIndex: [3, 2]
        Refinement: [1, 1]
      - LowerCornerIndex: [3, 1] # middle transition right
        UpperCornerIndex: [4, 2]
        Refinement: [0, 1]
      - LowerCornerIndex: [4, 1] # middle right
        UpperCornerIndex: [5, 2]
        Refinement: [1, 0]
      # top row
      - LowerCornerIndex: [0, 2] # top left
        UpperCornerIndex: [1, 3]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 2] # top transition left
        UpperCornerIndex: [2, 3]
        Refinement: [0, 0]
      - LowerCornerIndex: [2, 2] # top middle
        UpperCornerIndex: [3, 3]
        Refinement: [1, 1]
      - LowerCornerIndex: [3, 2] # top transition right
        UpperCornerIndex: [4, 3]
        Refinement: [0, 1]
      - LowerCornerIndex: [4, 2] # top right
        UpperCornerIndex: [5, 3]
        Refinement: [1, 0]
    BoundaryConditions:
      # Radial boundary conditions
      - Lower: None
        Upper:
          Sommerfeld:
            BlackHoleMass: *bh_mass
            BlackHoleSpin: *bh_spin
            OrbitalRadius: *orbital_radius
            MModeNumber: *m_mode_number
            HyperboloidalSlicing: True
            Order: 2
      # Angular boundary conditions
      - None

Amr:
  Verbosity: Quiet
  Criteria:
    - RefineAtPuncture
    - IncreaseResolution
  EnableInBlocks: All
  Policies:
    Isotropy: Anisotropic
    EnforceTwoToOneBalanceInNormalDirection: True
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: True
    AllowCoarsening: True
  MaxCoarseLevels: Auto
  Iterations: 2

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: Gauss
    Formulation: StrongInertial

Observers:
  VolumeFileName: "ScalarSelfForceVolume"
  ReductionFileName: "ScalarSelfForceReductions"

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 100
      RelativeResidual: 0
      AbsoluteResidual: 1.e-12
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: 0
    PreSmoothing: True
    UseBottomSolver: True
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: False

  SchwarzSmoother:
    Iterations: 2
    MaxOverlap: Auto
    Verbosity: Silent
    SubdomainSolver:
      ExplicitInverse:
        WriteMatrixToFile: None
        ComplexShift: 0.0
    ObservePerCoreReductions: False
    OutputVolumeData: False

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveSelfForce
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - MMode
            - BoyerLindquistRadius
            - RadiallyCompressedCoordinates
          BlocksToObserve: All
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]

RadiallyCompressedCoordinates:
  InnerRadius: *worldtube_right
  OuterRadius: *outer_radius
  Compression: *outer_shell_distribution

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Silent
  EnableDirectSolve: True

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: False
  Singletons: Auto
