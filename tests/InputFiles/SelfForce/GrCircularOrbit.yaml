Executable: SolveGrSelfForce
Testing:
  Check: parse
ExpectedOutput:
  - GrSelfForceReductions.h5
  - GrSelfForceVolume0.h5

---

Background: &background
  CircularOrbit:
    BlackHoleMass: &bh_mass 1.
    BlackHoleSpin: &bh_spin 0.5
    OrbitalRadius: &orbital_radius 10.
    MModeNumber: &m_mode_number 1

GrSelfForce:
  NullSlicingBlocks:
    - 'Block(0,0)'
    - 'Block(2,0)'
    - 'Block(0,1)'
    - 'Block(2,1)'
    - 'Block(0,2)'
    - 'Block(2,2)'

InitialGuess: *background

RandomizeInitialGuess: None

DomainCreator:
  AlignedLattice:
    # Order of dimensions is (r_*, theta)
    BlockBounds:
      # Puncture position is at r_* = 12.775940471833115
      - [-50., 0., &worldtube_right 25.55188094366623, &outer_radius 350.] # r_*
      # theta
      - [0., 1., 2.1415926536, 3.1415926536]
    Distributions:
      # r_*
      - [Linear, Linear, &outer_shell_distribution Inverse]
      # theta
      - [Linear, Linear, Linear]
    SingularityPositions:
      # r_*
      - [-51., -51., 0.]
      # theta
      - [-1., 0., 0.]
    InitialGridPoints: [4, 4]
    InitialLevels: [0, 0]
    RefinedGridPoints: []
    BlocksToExclude: []
    RefinedLevels:
      # bottom row
      - LowerCornerIndex: [0, 0] # bottom left
        UpperCornerIndex: [1, 1]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 0] # bottom middle
        UpperCornerIndex: [2, 1]
        Refinement: [0, 0]
      - LowerCornerIndex: [2, 0] # bottom right
        UpperCornerIndex: [3, 1]
        Refinement: [1, 0]
      # middle row
      - LowerCornerIndex: [0, 1] # middle left
        UpperCornerIndex: [1, 2]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 1] # source region
        UpperCornerIndex: [2, 2]
        Refinement: [1, 1]
      - LowerCornerIndex: [2, 1] # middle right
        UpperCornerIndex: [3, 2]
        Refinement: [1, 0]
      # top row
      - LowerCornerIndex: [0, 2] # top left
        UpperCornerIndex: [1, 3]
        Refinement: [0, 0]
      - LowerCornerIndex: [1, 2] # top middle
        UpperCornerIndex: [2, 3]
        Refinement: [0, 0]
      - LowerCornerIndex: [2, 2] # top right
        UpperCornerIndex: [3, 3]
        Refinement: [1, 0]
    BoundaryConditions:
      # Radial boundary conditions
      - Sommerfeld:
          BlackHoleMass: *bh_mass
          BlackHoleSpin: *bh_spin
          OrbitalRadius: *orbital_radius
          MModeNumber: *m_mode_number
      # Angular boundary conditions
      - Angular:
          MModeNumber: *m_mode_number

Amr:
  Verbosity: Debug
  Criteria:
    # - RefineAtPuncture
    - IncreaseResolution
  EnableInBlocks: All
  Policies:
    Isotropy: Anisotropic
    EnforceTwoToOneBalanceInNormalDirection: True
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: True
    AllowCoarsening: True
  MaxCoarseLevels: Auto
  Iterations: 2

PhaseChangeAndTriggers:
  # Run AMR in every iteration, but not on the initial guess
  - Trigger:
      EveryNIterations:
        N: 1
        Offset: 1
    PhaseChanges:
      - VisitAndReturn(EvaluateAmrCriteria)
      - VisitAndReturn(AdjustDomain)
      - VisitAndReturn(UpdateSections)
      - VisitAndReturn(CheckDomain)

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: Gauss
    Formulation: StrongInertial

Observers:
  VolumeFileName: "GrSelfForceVolume"
  ReductionFileName: "GrSelfForceReductions"

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 100
      RelativeResidual: 0
      AbsoluteResidual: 1.e-12
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: 0
    PreSmoothing: True
    UseBottomSolver: True
    PostSmoothingAtBottom: False
    Verbosity: Silent
    OutputVolumeData: False

  SchwarzSmoother:
    Iterations: 2
    MaxOverlap: Auto
    Verbosity: Silent
    SubdomainSolver:
      ExplicitInverse:
        WriteMatrixToFile: None
        ComplexShift: 0.0
    ObservePerCoreReductions: False
    OutputVolumeData: False

EventsAndTriggersAtIterations:
  - Trigger: Always
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - MMode
            - BoyerLindquistRadius
            - RadiallyCompressedCoordinates
          BlocksToObserve: All
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]

RadiallyCompressedCoordinates:
  InnerRadius: *worldtube_right
  OuterRadius: *outer_radius
  Compression: *outer_shell_distribution

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Silent
  EnableDirectSolve: True

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: False
  Singletons: Auto
