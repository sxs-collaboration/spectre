Executable: EvolveM1Grey
Testing:
  Timeout: 5
  Check: parse;execute
  Priority: High
ExpectedOutput:
  - M1GreyReductions.h5

---

Parallelization:
  ElementDistribution: NumGridPoints

ResourceInfo:
  AvoidGlobalProc0: false

Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.01
  MinimumTimeStep: 1e-7
  TimeStepper:
    Rk3Kennedy:
  Imex:
    Mode: SemiImplicit
    SolveTolerance: 1.0e-5
  LtsStepChoosers:
  VariableOrderAlgorithm:
    GoalOrder: 3

PhaseChangeAndTriggers:

InitialData: &InitialData
  ConstantM1:
    MeanVelocity: [0.1, 0.2, 0.15]
    ComovingEnergyDensity: 1.0

DomainCreator:
  Brick:
    LowerBound: [10.5, 0.0, 0.0]
    UpperBound: [11.5, 1.0, 1.0]
    Distribution: [Linear, Linear, Linear]
    InitialRefinement: [0, 0, 0]
    InitialGridPoints: [5, 5, 5]
    TimeDependence: None
    BoundaryConditions:
      - DirichletAnalytic:
          AnalyticPrescription: *InitialData
      - DirichletAnalytic:
          AnalyticPrescription: *InitialData
      - DirichletAnalytic:
          AnalyticPrescription: *InitialData

SpatialDiscretization:
  BoundaryCorrection:
    Rusanov:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto
    Filtering:
      - None:
          BlocksToFilter: All

EventsAndTriggersAtCheckpoints:

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 3
          Offset: 5
    Events:
      - ObserveNorms:
          SubfileName: Errors
          TensorsToObserve:
            - Name: Error(TildeE_ElectronNeutrinos1)
              NormType: L2Norm
              Components: Sum
            - Name: Error(TildeS_ElectronNeutrinos1)
              NormType: L2Norm
              Components: Sum
  - Trigger:
      Slabs:
        Specified:
          Values: [10]
    Events:
      - Completion

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:

Observers:
  VolumeFileName: "M1GreyVolume"
  ReductionFileName: "M1GreyReductions"
