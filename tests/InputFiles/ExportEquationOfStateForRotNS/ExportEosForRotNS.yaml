Executable: ExportEquationOfStateForRotNS
Testing:
  Check: parse;execute
  Priority: High
ExpectedOutput:
  - EOS.GN

---

EquationOfState:
  Equilibrium3D(HybridEos(PolytropicFluid)):
    HybridEos:
      PolytropicFluid:
        PolytropicConstant: 123.6
        PolytropicExponent: 2.
      ThermalAdiabaticIndex: 2.0
      MinTemperature: 1.e-16
OutputFileName: ./EOS.GN
NumberOfPoints: 40000
LowerBoundRestMassDensityCgs: 1.0e3
UpperBoundRestMassDensityCgs: 1.0e16
ThermodynamicProfileFilename: None
