Executable: EvolveGhSingleBlackHole
{{ TargetParams }}
Lev: {{ Lev | default("None") }}

---

Parallelization:
  ElementDistribution: NumGridPointsAndGridSpacing

# Note: most of the parameters in this file are just made up. They should be
# replaced with values that make sense once we have a better idea of the
# transition to ringdown.

InitialData:
  NumericInitialData:
    FileGlob: "{{ IdFileGlob }}"
    Subgroup: "{{ IdFileGlobSubgroup }}"
    ObservationValue: &InitialTime {{ MatchTime }}
    ObservationValueEpsilon: Auto
    ElementsAreIdentical: False
    Variables:
      SpacetimeMetric: SpacetimeMetric
      Pi: Pi
      Phi: Phi

DomainCreator:
  Sphere:
    InnerRadius: &InnerRadius {{ ExcisionRadius }}
    OuterRadius: "{{ OuterBdryRadius }}"
    Interior:
      ExciseWithBoundaryCondition:
        DemandOutgoingCharSpeeds:
    InitialRefinement:
      Shell0: [{{ L }}, {{ L }}, {{ L + 2 }}]
      Shell1: [{{ L }}, {{ L }}, {{ L + 4 }}]
    InitialGridPoints: {{ P + 1 }}
    UseEquiangularMap: True
    EquatorialCompression: None
    # The radial partitioning split has been tested for
    # equal-mass, zero spin, quasi-circular, but not
    # yet for other cases.
    RadialPartitioning: [50.0]
    RadialDistribution: [Logarithmic, Linear]
    WhichWedges: All
    TimeDependentMaps:
      InitialTime: *InitialTime
      ShapeMap:
        LMax: &MaximumL {{ ShapeMapLMax }}
        CoefficientTruncationLimit: 1e-12
        InitialValues:
          H5Filename: "{{ PathToAhCCoefsH5File }}"
          SubfileNames: ["{{ AhCCoefsSubfilePrefix }}AhC_Ylm",
                         "{{ AhCCoefsSubfilePrefix }}dtAhC_Ylm",
                         "{{ AhCCoefsSubfilePrefix }}dt2AhC_Ylm"]
          MatchTime: *InitialTime
          MatchTimeEpsilon: 1.e-10
          SetL1CoefsToZero: True
          CheckFrame: True
        # The excision surface initially has some outward velocity to avoid
        # incoming char speeds. The size control system should catch the
        # excision surface before it collides with the apparent horizon.
        # This value works for equal-mass, nonspinning, quasicircular,
        # and has not been tested for other configurations.
        SizeInitialValues: [0.0, -1.0, 0.0]
      RotationMap:
        InitialQuaternions: {{ Rotation }}
        DecayTimescale: 1.0
      ExpansionMap:
        # During the ringdown, only the outer boundary's expansion map is
        # applied.
        InitialValues: [1.0, 0.0, 0.0]
        InitialValuesOuterBoundary: {{ ExpansionOuterBdry }}
        DecayTimescale: 1.0
        DecayTimescaleOuterBoundary: 1.0
      TranslationMap:
        InitialValues: {{ Translation }}
      TransitionRotScaleTrans: True
    OuterBoundaryCondition:
      ConstraintPreservingBjorhus:
        Type: ConstraintPreservingPhysical
        IncomingWaveProfile: None

Evolution:
  InitialTime: *InitialTime
  InitialTimeStep: 0.0001
  MinimumTimeStep: 1e-7
  # This is the smallest interval we'd need to observe time step/constraints. If
  # you would like more frequent output, consider using dense output.
  InitialSlabSize: 0.1
  VariableOrderAlgorithm:
    GoalOrder: 4
  LtsStepChoosers:
    - LimitIncrease:
        Factor: 2
    - ErrorControl:
        AbsoluteTolerance: 1e-10
        RelativeTolerance: 1e-8
        MaxFactor: 2
        MinFactor: 0.25
        SafetyFactor: 0.95
  TimeStepper:
    AdamsMoultonPcMonotonic:
      Order: 4

EvolutionSystem:
  GeneralizedHarmonic:
    GaugeCondition:
      DampedHarmonic:
        SpatialDecayWidth: 17.0152695482514
        Amplitudes: [1.0, 0.0, 1.0]
        Exponents: [2, 2, 2]
    # The parameter choices here come from our experience with the Spectral
    # Einstein Code (SpEC). They should be suitable for evolutions of a
    # perturbation of a Kerr-Schild black hole.
    DampingFunctionGamma0:
      # SpEC uses a sum of 2 gaussians. Here, the expansion func of time
      # is just the identity, so TimeDependentTripleGaussian ought to work here
      # as a time-independent triple Gaussian..
      # The Gaussian amplitudes, widths, and centers are set according to what
      # SpEC does ringdown for an equal-mass, zero-spin, circular inspiral.
      TimeDependentTripleGaussian:
        Constant: 0.01
        Gaussian1:
          Amplitude: 7.0
          Width: 2.5
          Center: [0.0, 0.0, 0.0]
        Gaussian2:
          Amplitude: 1.0
          Width: 100.
          Center: [0.0, 0.0, 0.0]
        Gaussian3:
          Amplitude: 0.0
          Width: 100.0
          Center: [0.0, 0.0, 0.0]
        MovementMethod: ExpansionFactor
    DampingFunctionGamma1:
      Constant:
        Value: -1.0
    DampingFunctionGamma2:
      TimeDependentTripleGaussian:
        Constant: 0.001
        Gaussian1:
          Amplitude: 7.0
          Width: 2.5
          Center: [0.0, 0.0, 0.0]
        Gaussian2:
          Amplitude: 0.1
          Width: 100.0
          Center: [0.0, 0.0, 0.0]
        Gaussian3:
          Amplitude: 0.0
          Width: 100.0
          Center: [0.0, 0.0, 0.0]
        MovementMethod: ExpansionFactor

Filtering:
  ExpFilter0:
    Alpha: 64.0
    HalfPower: 210
    Enable: true
    BlocksToFilter: All

SpatialDiscretization:
  BoundaryCorrection:
    AveragedUpwindPenalty:
  DiscontinuousGalerkin:
    Formulation: StrongInertial
    Quadrature: GaussLobatto

Observers:
  VolumeFileName: "BbhVolume"
  ReductionFileName: "BbhReductions"
  SurfaceFileName: "BbhSurfaces"

Amr:
  Criteria:
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      RefinementLevel: Auto
      NumGridPoints: Auto
      ErrorBeyondLimits: False
    AllowCoarsening: True
  Verbosity: Quiet

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
       EvenlySpaced:
         # Current implementation checks wallclock at these global syncs
         Interval: 10
         Offset: 0
    PhaseChanges:
      - CheckpointAndExitAfterWallclock:
          WallclockHours: 23.5

EventsAndTriggersAtCheckpoints:
  - Trigger: Always
    Events:
      - ObserveFields:
          SubfileName: Checkpoints
          VariablesToObserve:
            - SpacetimeMetric
            - Pi
            - Phi
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All

EventsAndTriggersAtSlabs:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - ObserveTimeStep:
          SubfileName: TimeSteps
          PrintTimeToTerminal: True
          ObservePerCore: False
      - ObserveNorms:
          SubfileName: Norms
          TensorsToObserve:
          - Name: Lapse
            NormType: L2Norm
            Components: Individual
          - Name: PointwiseL2Norm(GaugeConstraint)
            NormType: L2Norm
            Components: Sum
          - Name: PointwiseL2Norm(ThreeIndexConstraint)
            NormType: L2Norm
            Components: Sum
  # Observe constraint energy more sparsely because it is expensive to compute.
  # Also use it for ErrorIfDataTooBig so we only compute it once.
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 100
          Offset: 0
    Events:
      - ObserveNorms:
          SubfileName: ConstraintEnergy
          TensorsToObserve:
          - Name: ConstraintEnergy
            NormType: L2Norm
            Components: Sum
      - ErrorIfDataTooBig:
          Threshold: 10
          VariablesToCheck: [ConstraintEnergy]
      - ErrorIfDataTooBig:
          Threshold: 100
          VariablesToCheck: [SpacetimeMetric]
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1
          Offset: 0
    Events:
      - ApparentHorizon
      - ExcisionBoundary
  # Observe volume data for visualization and debugging
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 1000
          Offset: 0
    Events:
      # SpatialRicciScalar and Psi4Real output for visualizations scripts.
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - SpacetimeMetric
            # For diagnostics:
            - ConstraintEnergy
            - PointwiseL2Norm(GaugeConstraint)
            - PointwiseL2Norm(ThreeIndexConstraint)
            # For visualization:
            - Lapse
            - SpatialRicciScalar
            - Psi4Real
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Float
          FloatingPointTypes: [Float]
          BlocksToObserve: All
  - Trigger:
      TimeCompares:
        Comparison: GreaterThanOrEqualTo
        Value: {{ FinalTime }}
    Events:
      - Completion
  # Discard old data to reduce memory use
  - Trigger: Always
    Events:
      - CleanFunctionsOfTime

EventsAndTriggersAtSteps:

EventsAndDenseTriggers:
  # BondiSachs output needs to be often enough for CCE to run properly. An
  # interval of 0.1 was found to work well in SpEC.
  - Trigger:
      Times:
        EvenlySpaced:
          Interval: 0.1
          Offset: 0.0
    Events:
      - BondiSachsInterpolation

EventsRunAtCleanup:
  ObservationValue: -1000.0
  Events:
    - ObserveTimeStepVolume:
        SubfileName: FailureTimeStep
        FloatingPointType: Double
        CoordinatesFloatingPointType: Float

Interpolator:
  Verbosity: Silent

ApparentHorizons:
  LMax: *MaximumL
  ApparentHorizon: &Ah
    Criteria:
    InitialGuess:
      LMax: *MaximumL
      Radius: 2.2
      Center: [0., 0., 0.]
    FastFlow:
      Flow: Fast
      Alpha: 1.0
      Beta: 0.5
      AbsTol: 1e-12
      TruncationTol: 1e-5
      DivergenceTol: 5
      DivergenceIter: 5
      MaxIts: 100
    Verbosity: Quiet
    MaxComputeCoordsRetries: 3
    BlocksForHorizonFind: ["Shell0"]
  ControlSystemSingleAh: *Ah
  ControlSystemCharSpeedAh: *Ah

InterpolationTargets:
  BondiSachsInterpolation:
    LMax: 16
    Radius: [100, 150, 200]
    Center: [0, 0, 0]
    AngularOrdering: Cce
  ExcisionBoundary: &ExBdry
    LMax: *MaximumL
    Center: [0., 0., 0.]
    Radius: *InnerRadius
    AngularOrdering: "Strahlkorper"
  ControlSystemCharSpeedExcision: *ExBdry

Cce:
  BondiSachsOutputFilePrefix: "BondiSachs"

ControlSystems:
  WriteDataToDisk: false
  MeasurementsPerUpdate: 4
  DelayUpdate: true
  Verbosity: Silent
  Translation:
    Averager:
      AverageTimescaleFraction: 0.25
      Average0thDeriv: false
    Controller:
      UpdateFraction: 0.3
    TimescaleTuner:
      InitialTimescales: 0.2
      MinTimescale: 1.0e-2
      MaxTimescale: 10.0
      IncreaseThreshold: 2.5e-4
      DecreaseThreshold: 1.0e-3
      IncreaseFactor: 1.01
      DecreaseFactor: 0.98
    ControlError:
  Shape:
    Averager:
      AverageTimescaleFraction: 0.25
      # This is different from inspiral but same as SpEC.
      # See ComputePostMergerDataFromAhC.pl:2278
      Average0thDeriv: true
    Controller:
      UpdateFraction: 0.3
    TimescaleTuner:
      InitialTimescales: 0.04
      MinTimescale: 1.0e-3
      MaxTimescale: 10.0
      IncreaseThreshold: 2.5e-4
      DecreaseThreshold: 1.0e-3
      IncreaseFactor: 1.01
      DecreaseFactor: 0.98
    ControlError:
  Size:
    Averager:
      AverageTimescaleFraction: 0.25
      Average0thDeriv: true
    Controller:
      UpdateFraction: 0.1
    TimescaleTuner:
      InitialTimescales: 0.008
      MinTimescale: 1.0e-5
      MaxTimescale: 20.0
      IncreaseThreshold: 2.5e-4
      IncreaseFactor: 1.01
    ControlError:
      MaxNumTimesForZeroCrossingPredictor: 4
      SmoothAvgTimescaleFraction: 0.25
      DeltaRDriftOutwardOptions: None
      DeltaRDriftInwardOptions: None
      InitialState: DeltaR
      SmootherTuner:
        InitialTimescales: [0.02]
        MinTimescale: 1.0e-4
        MaxTimescale: 20.0
        IncreaseThreshold: 2.5e-4
        DecreaseThreshold: 1.0e-3
        IncreaseFactor: 1.01
        DecreaseFactor: 0.9

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto
