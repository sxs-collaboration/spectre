Executable: SolveXcts
{{ TargetParams }}
ExpectedOutput:
  - BbhReductions.h5
  - BbhVolume*.h5
Next:
  Run: spectre.Pipelines.Bbh.PostprocessId:postprocess_id
  With:
    id_input_file_path: __file__
    id_run_dir: ./
    pipeline_dir: {{ pipeline_dir | default("None") }}
    horizon_l_max: {{ HorizonLMax }}
    control: {{ control }}
    control_refinement_level: {{ L }}
    control_polynomial_order: {{ P }}
    control_params:
      - MassA
      - MassB
      - DimensionlessSpinA
      - DimensionlessSpinB
      - CenterOfMass
      - AdmLinearMomentum
    evolve: {{ evolve }}
    eccentricity_control: {{ eccentricity_control }}
    negative_expansion_bc: {{ negative_expansion_bc }}
    scheduler: {{ scheduler | default("None") }}
    copy_executable: {{ copy_executable | default("None") }}
    submit_script_template: {{ submit_script_template | default("None") }}
    submit: True

---

Parallelization:
  ElementDistribution: NumGridPoints

Background: &background
  Binary:
    XCoords: [&x_left {{ XLeft }}, &x_right {{ XRight }}]
    CenterOfMassOffset:
      - &y_offset {{ CenterOfMassOffset_y }}
      - &z_offset {{ CenterOfMassOffset_z }}
    ObjectLeft: &kerr_left
      KerrSchild:
        Mass: &mass_left {{ ConformalMassLeft }}
        Spin: &spin_left
          - {{ ConformalSpinLeft_x }}
          - {{ ConformalSpinLeft_y }}
          - {{ ConformalSpinLeft_z }}
        Center: [0., 0., 0.]
        Velocity: [0., 0., 0.]
    ObjectRight: &kerr_right
      KerrSchild:
        Mass: &mass_right {{ ConformalMassRight }}
        Spin: &spin_right
          - {{ ConformalSpinRight_x }}
          - {{ ConformalSpinRight_y }}
          - {{ ConformalSpinRight_z }}
        Center: [0., 0., 0.]
        Velocity: [0., 0., 0.]
    AngularVelocity: {{ OrbitalAngularVelocity }}
    Expansion: {{ RadialExpansionVelocity }}
    LinearVelocity:
      - {{ LinearVelocity_x }}
      - {{ LinearVelocity_y }}
      - {{ LinearVelocity_z }}
    FalloffWidths:
      - {{ FalloffWidthLeft }}
      - {{ FalloffWidthRight }}

InitialGuess: *background

DomainCreator:
  BinaryCompactObject:
    ObjectA:
      InnerRadius: {{ ExcisionRadiusRight }}
      OuterRadius: {{ ObjectOuterRadius }}
      XCoord: *x_right
      Interior:
        ExciseWithBoundaryCondition:
          ApparentHorizon:
            Center: [*x_right, *y_offset, *z_offset]
            Rotation:
              - {{ HorizonRotationRight_x }}
              - {{ HorizonRotationRight_y }}
              - {{ HorizonRotationRight_z }}
            Lapse: *kerr_right
            {% if negative_expansion_bc %}
            NegativeExpansion: *kerr_right
            {% else %}
            NegativeExpansion: None
            {% endif %}
      UseLogarithmicMap: True
    ObjectB:
      InnerRadius: {{ ExcisionRadiusLeft }}
      OuterRadius: {{ ObjectOuterRadius }}
      XCoord: *x_left
      Interior:
        ExciseWithBoundaryCondition:
          ApparentHorizon:
            Center: [*x_left, *y_offset, *z_offset]
            Rotation:
              - {{ HorizonRotationLeft_x }}
              - {{ HorizonRotationLeft_y }}
              - {{ HorizonRotationLeft_z }}
            Lapse: *kerr_left
            {% if negative_expansion_bc %}
            NegativeExpansion: *kerr_left
            {% else %}
            NegativeExpansion: None
            {% endif %}
      UseLogarithmicMap: True
    CuttingPlanePosition: Auto
    CenterOfMassOffset: [*y_offset, *z_offset]
    Envelope:
      Radius: &outer_shell_inner_radius {{ EnvelopeRadius }}
      RadialDistribution: Projective
    OuterShell:
      Radius: &outer_radius 1e5
      RadialPartitioning: []
      RadialDistribution: &outer_shell_distribution Inverse
      OpeningAngle: 120.0
      BoundaryCondition: Robin
    UseEquiangularMap: True
    CubeScale: 1.0
    InitialRefinement:
      ObjectAShell:     [{{ L }}, {{ L }}, {{ L }}]
      ObjectBShell:     [{{ L }}, {{ L }}, {{ L + ExtraRadRef }}]
      ObjectACube:      [{{ L }}, {{ L }}, {{ L }}]
      ObjectBCube:      [{{ L }}, {{ L }}, {{ L }}]
      Envelope:         [{{ L }}, {{ L }}, {{ L + 1 }}]
      OuterShell0:       [{{ L + 1 }}, {{ L + 1 }}, {{ L }}]
    # This p-refinement represents a crude manual optimization of the domain. We
    # will need AMR to optimize the domain further.
    InitialGridPoints:
      ObjectAShell:   [{{ P + 1}}, {{ P + 1}}, {{ P + 5}}]
      ObjectBShell:   [{{ P + 1}}, {{ P + 1}}, {{ P + 5 + ExtraRadPoints}}]
      ObjectACube:    [{{ P + 1}}, {{ P + 1}}, {{ P + 2}}]
      ObjectBCube:    [{{ P + 1}}, {{ P + 1}}, {{ P + 2}}]
      Envelope:       [{{ P + 1}}, {{ P + 1}}, {{ P + 1}}]
      OuterShell0:     [{{ P + 1}}, {{ P + 1}}, {{ P + 1}}]
    TimeDependentMaps:
      InitialTime: 0.
      ExpansionMap: None
      RotationMap: None
      TranslationMap: None
      SkewMap: None
      ShapeMapA:
        LMax: {{ HorizonLMax }}
        CoefficientTruncationLimit: 0.
        InitialValues:
          Mass: *mass_right
          Spin: *spin_right
        SizeInitialValues: Auto
        TransitionEndsAtCube: False
      ShapeMapB:
        CoefficientTruncationLimit: 0.
        LMax: {{ HorizonLMax }}
        InitialValues:
          Mass: *mass_left
          Spin: *spin_left
        SizeInitialValues: Auto
        TransitionEndsAtCube: False
      GridCenters: None

Amr:
  Verbosity: Verbose
  Criteria: []
  EnableInBlocks: All
  Policies:
    EnforceTwoToOneBalanceInNormalDirection: true
    Isotropy: Anisotropic
    Limits:
      NumGridPoints: Auto
      RefinementLevel: Auto
      ErrorBeyondLimits: False
    AllowCoarsening: True
  MaxCoarseLevels: Auto
  Iterations: 1

PhaseChangeAndTriggers: []

Discretization:
  DiscontinuousGalerkin:
    PenaltyParameter: 1.5
    Massive: True
    Quadrature: GaussLobatto
    Formulation: WeakInertial

Observers:
  VolumeFileName: "BbhVolume"
  ReductionFileName: "BbhReductions"

NonlinearSolver:
  NewtonRaphson:
    ConvergenceCriteria:
      MaxIterations: 20
      RelativeResidual: 0.
      AbsoluteResidual: 1.e-8
    SufficientDecrease: 1.e-4
    MaxGlobalizationSteps: 10
    DampingFactor: 1.
    Verbosity: Verbose

LinearSolver:
  Gmres:
    ConvergenceCriteria:
      MaxIterations: 100
      RelativeResidual: 1.e-3
      AbsoluteResidual: 1.e-9
    Verbosity: Quiet

  Multigrid:
    Iterations: 1
    InitialCoarseLevels: Auto
    PreSmoothing: True
    UseBottomSolver: False
    PostSmoothingAtBottom: True
    Verbosity: Silent
    OutputVolumeData: False

  SchwarzSmoother:
    MaxOverlap: 2
    Iterations: 3
    Verbosity: Silent
    SubdomainSolver:
      Gmres:
        ConvergenceCriteria:
          MaxIterations: 3
          RelativeResidual: 1.e-4
          AbsoluteResidual: 1.e-10
        Verbosity: Silent
        Restart: None
        Preconditioner:
          MinusLaplacian:
            Solver:
              ExplicitInverse:
                WriteMatrixToFile: None
            BoundaryConditions: Auto
    SkipResets: True
    ObservePerCoreReductions: False
    OutputVolumeData: False

RadiallyCompressedCoordinates:
  InnerRadius: *outer_shell_inner_radius
  OuterRadius: *outer_radius
  Compression: *outer_shell_distribution

EventsAndTriggersAtIterations:
  - Trigger: HasConverged
    Events:
      - ObserveFields:
          SubfileName: VolumeData
          VariablesToObserve:
            - ConformalFactor
            - Lapse
            - Shift
            - ShiftExcess
            - SpatialMetric
            - InverseSpatialMetric
            - SpatialChristoffelSecondKind
            - ExtrinsicCurvature
            - SpatialRicci
            - RadiallyCompressedCoordinates
          InterpolateToMesh: None
          ProjectToMesh: None
          CoordinatesFloatingPointType: Double
          FloatingPointTypes: [Double]
          BlocksToObserve: All
      - ObserveAdmIntegrals

RandomizeInitialGuess: None

ResourceInfo:
  AvoidGlobalProc0: false
  Singletons: Auto

BuildMatrix:
  MatrixSubfileName: None
  Verbosity: Verbose
  EnableDirectSolve: True
  SkipResets: True
